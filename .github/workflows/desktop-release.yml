name: Desktop release

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pack: desktop:pack:win
          - os: macos-latest
            pack: desktop:pack:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: kvmoonshot-trial-sdk/package-lock.json
      - name: Install and build
        working-directory: kvmoonshot-trial-sdk
        run: |
          npm ci
          npm run build
      - name: Package desktop
        working-directory: kvmoonshot-trial-sdk
        run: npm run ${{ matrix.pack }}
      - uses: actions/upload-artifact@v4
        with:
          name: kvmoonshot-desk-${{ matrix.os }}
          path: |
            kvmoonshot-trial-sdk/dist/desktop/*.exe
            kvmoonshot-trial-sdk/dist/desktop/*.zip
            kvmoonshot-trial-sdk/dist/desktop/*.dmg
          if-no-files-found: error
